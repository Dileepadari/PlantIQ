{# 404 and 500. HTML for browsers; /api/* paths get JSON instead, decided in
   the app factory. #}
{% import "_icons.html" as ui %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>{{ code }} | PlantIQ</title>
  <link rel="icon" href="{{ url_for('static', filename='images/logo-mark.png') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
  <script>
    try {
      var t = localStorage.getItem('plantiq-theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <div style="min-height:100vh;display:grid;place-items:center;padding:24px">
    <div class="card" style="max-width:400px;width:100%">
      <div class="card-body center">
        <span class="logo-badge" style="margin:0 auto 16px">
          <img class="logo-mono" src="{{ url_for('static', filename='images/logo-mark.png') }}" alt="" />
        </span>
        <h1 style="font-size:2.4rem;margin-bottom:4px">{{ code }}</h1>
        <p class="muted">{{ message }}</p>
        <div class="form-actions" style="justify-content:center">
          <a class="btn btn-primary" href="{{ url_for('views.dashboard') }}">Back to the dashboard</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
