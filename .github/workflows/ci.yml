name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - run: ruff check src tests

      - run: pytest -q

  no-database-in-the-repository:
    name: No database file is tracked
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # src/Database.db was tracked for two years and carried six people's real
      # names, email addresses and clear-text passwords. .gitignore covers it
      # now, but .gitignore does not apply to a file already added with -f.
      - name: No .db, .sqlite or .sqlite3 is tracked
        run: |
          found=$(git ls-files | grep -iE '\.(db|sqlite3?)$' || true)
          if [ -n "$found" ]; then
            echo "A database file is tracked again:"
            echo "$found"
            exit 1
          fi
          echo "clean"

      # The firmware reads every credential from an untracked secrets.h. A
      # literal reappearing here means somebody inlined one again.
      - name: No credential literal in the firmware
        run: |
          if grep -nE '(ssid|password|apiKey|mqttPass|mqttUserName|ClientID)[^=]*=[^=]*"[^"]{6,}"' Arduino/*.ino; then
            echo "A credential looks inlined in the sketch. Use secrets.h."
            exit 1
          fi
          echo "clean"

  readme-pair:
    name: The light README matches its source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: |
          node scripts/build-light-readme.mjs
          git diff --exit-code README-light.md
